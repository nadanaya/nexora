version: axhub/v1
name: nexora
database:
  engine: postgres
runtime:
  port: 3000
  health_path: /healthz
build:
  strategy: auto
  framework: nextjs
  dockerfile: Dockerfile
  deploy_method: docker
env:
  optional:
    - name: APPHUB_API_URL
      scope: runtime
    - name: APPHUB_APP_SLUG
      scope: runtime
    - name: APPHUB_TENANT
      scope: runtime

# 배포 전 검사. 디자인 토큰 규칙을 어기면 여기서 걸려요.
ci:
  commands:
    - bash scripts/check-design.sh
